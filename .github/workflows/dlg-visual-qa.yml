name: DLG browser and viewport QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/dlg-live-style-direct-contact-20261107]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and static QA
        run: node scripts/build.mjs && node scripts/qa-site.mjs
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test visual proportions and interactions
        run: node scripts/qa-browser.mjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dlg-viewport-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
