<!doctype html>
<html lang="{{ page.lang | default: 'ka' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafbfa">
  <title>{{ page.title | escape }} — Shakhkulashvili Legal</title>
  <meta name="description" content="{{ page.description | default: page.summary | escape }}">
  <meta property="og:title" content="{{ page.title | escape }} — Shakhkulashvili Legal">
  <meta property="og:description" content="{{ page.description | default: page.summary | escape }}">
  <meta property="og:type" content="{% if page.layout == 'article' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/noto-georgian.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v=20260917-hub">
  <script src="{{ '/script.js' | relative_url }}?v=20260917-hub" defer></script>
  <script src="{{ '/resources/resources.js' | relative_url }}?v=20260917-hub" defer></script>
</head>
<body class="resource-page" data-default-language="{{ page.lang | default: 'ka' }}" data-title-ka="{{ page.title | escape }} — Shakhkulashvili Legal" data-title-en="{{ page.title_en | default: page.title | escape }} — Shakhkulashvili Legal" data-description-ka="{{ page.description | default: page.summary | escape }}" data-description-en="{{ page.description_en | default: page.summary_en | default: page.description | default: page.summary | escape }}">
  <a class="skip-link" href="#main" data-en="Skip to content">მთავარ შინაარსზე გადასვლა</a>
  {% include resource-header.html %}
  {{ content }}
  {% include resource-footer.html %}
</body>
</html>
